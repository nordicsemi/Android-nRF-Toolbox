name: Unit tests
on:
  pull_request:
  workflow_dispatch:
# A new push to a pull request cancels the run for the previous commit.
concurrency:
  group: unit-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  unitTests:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      # The tests do not need the git history. Without a tag the version is 0.0.0.
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: 'jetbrains'
          java-version: '21'
          cache: 'gradle'
      # Runs the unit tests of all modules. `--continue` runs all modules even if one fails.
      - name: Run unit tests
        shell: bash
        run: ./gradlew testDebugUnitTest --continue --stacktrace
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: '**/build/reports/tests/'
          if-no-files-found: ignore
